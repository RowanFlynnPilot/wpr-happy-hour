name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    # Pinned: "ubuntu-latest" is moving to Ubuntu 26, where Playwright's
    # --with-deps install is the usual break. Move it with a Playwright bump.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      # Newsletter card images (dist/digest/) — see scripts/render-digest.mjs.
      # Rendered from bars.json at deploy time, one per weekday, so no schedule
      # is needed. A failed render fails the deploy: re-run the workflow.
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # The built finder opened in a real browser with the clock held still: each
      # view, a search, a bar's link, the listing check. A failure stops the deploy.
      - run: npm run smoke
      - run: npm run render
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
