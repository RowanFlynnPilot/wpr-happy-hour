<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Hour Finder — Wausau Pilot &amp; Review</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="Live happy hour finder for the Wausau area — see what's pouring right now, plan by day, and find drink and food specials at partner bars. A Wausau Pilot &amp; Review community tool."
    />
    <meta name="theme-color" content="#3A867C" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- Link previews for shared deep links (bars posting their ?bar= URLs).
         One static card site-wide — per-bar previews would need a backend; don't. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Wausau Pilot &amp; Review" />
    <meta property="og:title" content="Happy Hour Finder — Wausau Pilot &amp; Review" />
    <meta property="og:description" content="See what's pouring right now at bars across the Wausau area, or plan ahead by day." />
    <meta property="og:url" content="https://rowanflynnpilot.github.io/wpr-happy-hour/" />
    <meta property="og:image" content="https://rowanflynnpilot.github.io/wpr-happy-hour/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Plausible (register site "rowanflynnpilot.github.io" in the WPR account).
         outbound-links variant: pageviews + clicks on bar websites/Directions —
         the numbers Chris brings to renewal calls. Localhost is ignored. -->
    <script
      defer
      data-domain="rowanflynnpilot.github.io"
      src="https://plausible.io/js/script.outbound-links.js"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
