<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Hour Finder — Wausau Pilot &amp; Review</title>
    <link rel="preload" href="./fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/public-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <meta
      name="description"
      content="Live happy hour finder for the Wausau area — see what's pouring right now, plan by day, and find drink and food specials at partner bars. A Wausau Pilot &amp; Review community tool."
    />
    <!-- PRE-LAUNCH: keeps the unfinished finder out of search results. Remove this
         line on launch day (LAUNCH.md) and add the canonical to the WordPress page. -->
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#173A35" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- Link previews for shared deep links (bars posting their ?bar= URLs).
         One static card site-wide — per-bar previews would need a backend; don't. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Wausau Pilot &amp; Review" />
    <meta property="og:title" content="Happy Hour Finder — Wausau Pilot &amp; Review" />
    <meta property="og:description" content="See what's pouring right now at bars across the Wausau area, or plan ahead by day." />
    <meta property="og:url" content="https://rowanflynnpilot.github.io/wpr-happy-hour/" />
    <meta property="og:image" content="https://rowanflynnpilot.github.io/wpr-happy-hour/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Happy Hour Finder: see what’s pouring right now in the Wausau area. From Wausau Pilot &amp; Review." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Plausible (register site "rowanflynnpilot.github.io" in the WPR account).
         outbound-links variant: pageviews + clicks on bar websites/Directions —
         the numbers Chris brings to renewal calls. Localhost is ignored. -->
    <script
      defer
      data-domain="rowanflynnpilot.github.io"
      src="https://plausible.io/js/script.outbound-links.js"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: sans-serif; padding: 24px; max-width: 40em">
        The Happy Hour Finder needs JavaScript to show today’s specials. Turn it on and reload, or visit
        <a href="https://wausaupilotandreview.com" target="_top">Wausau Pilot &amp; Review</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
